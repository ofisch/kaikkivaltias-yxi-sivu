<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <title>Kaikkivaltias</title>
  </head>
  <body>
    <main>
      <!--<h1 id="kaikkivaltias-title">Kaikkivaltias</h1>--->

      
      <img
        id="yxi-cover-img"
        style="margin-top: 1em"
        src="./img/kansiVaalogol.jpg"
        alt="kisu"
      />

      <!-- iso YXI otsiko -->

      <h2 id="yxi-text">
        <span>Y</span>
        <span>X</span>
        <span>I</span>
      </h2>

      <input type="text" placeholder="YXI" id="yxi-input" value="YXI" />



      <!---kuuntelulinkit-->

      <div class="listen-links">
        <a href="https://kaikkivaltias.bandcamp.com"
          ><img src="./img/bancamp-logo.png" alt="bandcamp logo" />Bandcamp</a
        >
        <a href=""
          ><img src="./img/deezer-logo.png" alt="Deezer logo" />Deezer</a
        >
        <a href=""
          ><img src="./img/spotify-logo.png" alt="Spotify logo" />Spotify</a
        >
      </div>

      
      <!---yxi risti-->

      <div class="yxi-cross">
        <div><h3>Y</h3></div>
        <h3 class="yxi-cross-vertical">
          <span>Y</span>
          <span>X</span>
          <span>I</span>
        </h3>
        <div><h3>I</h3></div>
      </div>

      <footer>
       

        <img style="max-width: 100px" src="./img/KPunane.png" alt="" />
      </footer>
    </main>
  </body>

  <script>
    const yxiText = document.querySelector("#yxi-text");

    const yxiInput = document.querySelector("#yxi-input");

    yxiInput.addEventListener("input", (event) => {
      const inputValue = event.target.value.toUpperCase();
      const letters = inputValue.split("");

      yxiText.innerHTML = letters
        .map((letter) => `<span>${letter}</span>`)
        .join("");
    });

    const yxiAlbumCover = document.querySelector("#yxi-cover-img");

    yxiAlbumCover.addEventListener("click", () => {
      window.location.href = "/info.html";
    });

  </script>
</html>
