<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaikkivaltias</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1 id="kaikkivaltias-title">Kaikkivaltias</h1>
      <div id="banner-image">
        <img src="./img/loitsutorni.png" alt="loitsutorni cover art" />
      </div>

      <h1>"Loitsutorni"</h1>

      <div id="enter-password">
        <h2>Enter password</h2>
        <input type="text" />
        <button>Submit</button>
      </div>
    </main>
  </body>

  <script>
    if (localStorage.getItem("loggedIn") === "true") {
      window.location.href = "/yxi.html";
    }

    const button = document.querySelector("button");
    const input = document.querySelector("input");

    const correctPasswords = ["kaikkivaltias", "miekkamyrsky", "vittu"];

    button.addEventListener("click", () => {
      const password = input.value;
      if (correctPasswords.includes(password)) {
        alert("Access granted!");
        //redirect to another page
        window.location.href = "/yxi.html";
        localStorage.setItem("loggedIn", "true");
      } else {
        alert("Access denied!");
      }
    });
  </script>
</html>
